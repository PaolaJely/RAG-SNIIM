# Render Blueprint — deploy de la API
# Docs: https://render.com/docs/blueprint-spec
#
# Uso: en Render → New → Blueprint → conecta este repo.
# Configura las env vars marcadas sync: false en el dashboard.

services:
  - type: web
    name: rag-sniim-api-deepseek
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: QDRANT_URL
        value: https://0cd1ea76-cfb2-4f16-842f-138f1604d7d6.us-west-2-0.aws.cloud.qdrant.io
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: sniim
      - key: POSTGRES_HOST
        value: ep-holy-sky-axoxtpy5.c-4.us-east-2.aws.neon.tech
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_DB
        value: neondb
      - key: POSTGRES_USER
        value: neondb_owner
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_SSLMODE
        value: require
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_LLM_MODEL
        value: deepseek-v4-flash
      - key: DEEPSEEK_THINKING_MODE
        value: disabled
      - key: SEARCH_K
        value: "32"
      - key: SIMILARITY_THRESHOLD
        value: "0.35"
      - key: CORS_ORIGINS
        value: "*"
      - key: IMPORT_ADMIN_TOKEN
        sync: false
